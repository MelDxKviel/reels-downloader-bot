name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14.8"

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run --locked ruff format --check src/ tests/

      - name: Check linting
        run: uv run --locked ruff check src/ tests/

  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14.8"

      - name: Install FFmpeg for media tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests with coverage
        run: uv run --locked pytest tests/ -v --tb=short --cov=src --cov-report=xml --cov-report=term-missing
        env:
          BOT_TOKEN: "0:test"
          ADMIN_USERS: "123456"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  docker:
    name: Docker and PostgreSQL smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: downloader_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d downloader_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag reels-bot:ci .

      - name: Check runtime and PostgreSQL
        run: |
          docker run --rm --network host -i \
            -e BOT_TOKEN=0:test \
            -e ADMIN_USERS=314 \
            -e SMOKE_DATABASE_URL=postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/downloader_ci \
            reels-bot:ci python - < tests/smoke_runtime.py
