services:
  bot:
    build: .
    container_name: downloader-bot
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - ADMIN_USERS=${ADMIN_USERS}
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/downloader_bot
      - DOWNLOAD_DIR=/app/downloads
      - YT_COOKIES_FILE=${YT_COOKIES_FILE:-}
      - INSTA_COOKIES_FILE=${INSTA_COOKIES_FILE:-}
      - VIDEO_STORAGE_CHAT_ID=${VIDEO_STORAGE_CHAT_ID:-}
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-ru}
      - GIF_FPS=${GIF_FPS:-30}
      - GIF_MAX_DURATION=${GIF_MAX_DURATION:-15}
      - GIF_MAX_SIZE=${GIF_MAX_SIZE:-640}
      - GIF_CRF=${GIF_CRF:-28}
      - CACHE_AUTOCLEAN_DEFAULT=${CACHE_AUTOCLEAN_DEFAULT:-false}
      - CACHE_MAX_AGE_HOURS=${CACHE_MAX_AGE_HOURS:-168}
      - CACHE_CLEANUP_INTERVAL=${CACHE_CLEANUP_INTERVAL:-3600}
      - DOWNLOAD_TIMEOUT=${DOWNLOAD_TIMEOUT:-300}
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-3}
      - MAX_QUEUED_JOBS=${MAX_QUEUED_JOBS:-12}
      - MAX_USER_JOBS=${MAX_USER_JOBS:-2}
    volumes:
      - ./downloads:/app/downloads
      - ${YT_COOKIES_FILE_HOST_PATH:-./cookies.txt}:/app/cookies.txt:ro
      - ${INSTA_COOKIES_FILE_HOST_PATH:-./instagram-cookies.txt}:/app/instagram-cookies.txt:ro
    networks:
      - bot-network

  db:
    image: postgres:17-alpine
    container_name: downloader-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=downloader_bot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d downloader_bot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  bot-network:
    driver: bridge
