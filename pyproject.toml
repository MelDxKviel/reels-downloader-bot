[project]
name = "downloader-tg"
version = "1.0.0"
description = "Telegram bot for downloading videos from various platforms"
readme = "README.md"
requires-python = ">=3.14.8,<3.15"
dependencies = [
    "aiogram>=3.30.0",
    "yt-dlp>=2024.12.13",
    "python-dotenv>=1.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
# Транспорт для scripts/sync_cookies.py при SSH-входе по паролю.
# Не входит в рантайм бота (Docker-образ ставит зависимости с --no-dev и без extras).
ssh = ["paramiko>=3.0.0"]

[project.scripts]
downloader-bot = "src.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=5.0.0",
    "aiosqlite>=0.19.0",
    "pillow>=11.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

